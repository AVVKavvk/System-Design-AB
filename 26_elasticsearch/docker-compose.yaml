services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      # Run as a single node for local development
      - discovery.type=single-node
      # Disable security (HTTPS/passwords) for easy local testing
      - xpack.security.enabled=false
      # Limit RAM usage to 512MB (adjust if you need more memory later)
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      # Map the host port 9200 to the container port 9200
      - "9200:9200"
    volumes:
      # Persist data so your indices survive container restarts
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
volumes:
  # Declare the named volume
  es_data:
